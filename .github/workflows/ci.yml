name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  conformance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @firebase-compat/server build
      - run: npm install -g firebase-tools
      - name: Start Firebase Emulator Suite (reference backend)
        working-directory: packages/conformance/emulator
        run: |
          firebase emulators:start --project demo-compat > emulator.log 2>&1 &
          for port in 4400 9099 8080 9000 9199; do
            for i in $(seq 1 120); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 2; done
          done
          # warm up the auth emulator before measuring
          curl -s -X POST -H 'content-type: application/json' -d '{}' "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signUp?key=warmup" > /dev/null
          sleep 3
      - run: node src/run.mjs --target emulator
        working-directory: packages/conformance
      - run: node src/run.mjs --target compat
        working-directory: packages/conformance
      - run: node src/run.mjs --compare results/emulator.json results/compat.json --strict
        working-directory: packages/conformance
      - run: cat packages/conformance/results/report.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: packages/conformance/results
